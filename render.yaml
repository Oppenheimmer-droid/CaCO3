# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    rootDir: paperboy
    buildCommand: |
      echo "=== Starting build ==="
      # Instalar todas las dependencias (incluyendo devDependencies para vite)
      npm install --include=dev
      # Build del frontend
      npm run build
      echo "Installing server dependencies..."
      cd server && npm install
      echo "=== Build complete ==="
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/api
      - key: OLLAMA_MODEL
        value: llama3
      - key: OLLAMA_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: fal
      - key: FAL_API_KEY
        sync: false
      - key: FAL_MODEL
        value: fal-ai/flux-pro
