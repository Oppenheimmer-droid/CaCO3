# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    rootDir: paperboy
    buildCommand: |
      echo "=== Starting build ==="
      # Instalar todas las dependencias (incluyendo devDependencies para vite)
      npm ci
      # Build del frontend
      npm run build || npx vite build
      echo "Installing server dependencies..."
      cd server && npm install
      echo "=== Build complete ==="
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_API_KEY
        sync: false
