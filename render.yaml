# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    rootDir: paperboy
    buildCommand: |
      echo "=== Starting build ==="
      echo "Cleaning any existing dist..."
      rm -rf dist
      echo "Installing dependencies..."
      npm install
      echo "Running production build..."
      npm run build
      echo "Verifying build output..."
      if [ ! -f "dist/index.html" ]; then
        echo "ERROR: dist/index.html not found after build!"
        exit 1
      fi
      echo "dist/index.html found:"
      ls -la dist/
      echo "Installing server dependencies..."
      cd server && npm install
      echo "=== Build complete ==="
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_API_KEY
        sync: false
