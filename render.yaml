# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    rootDir: paperboy
    buildCommand: |
      npm install
      npm run build
      echo "Build completed. Checking dist..."
      ls -la dist/ || echo "ERROR: dist not found"
      cd server && npm install
      echo "Server dependencies installed"
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_API_KEY
        sync: false
