# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

envVars:
  - fromGroup: paperboy-secrets

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    buildCommand: "npm run build"
    startCommand: "npm start"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: IMAGE_PROVIDER
        value: fal
      - key: FAL_MODEL
        value: fal-ai/flux-pro
      - key: GROQ_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
