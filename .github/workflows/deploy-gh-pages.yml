name: Deploy to GitHub Pages

'on':
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paperboy/package-lock.json
      - name: Install dependencies
        run: cd paperboy && npm ci
      - name: Build app
        env:
          VITE_AI_PROVIDER: ollama
          VITE_OLLAMA_API_KEY: ${{ secrets.VITE_OLLAMA_API_KEY }}
        run: cd paperboy && npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./paperboy/dist
          publish_branch: gh-pages
          force_orphan: true
