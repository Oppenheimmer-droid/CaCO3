# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    buildCommand: |
      # Instalar dependencias del frontend (incluyendo devDependencies)
      npm install --include=dev
      # Build del frontend React
      npm run build
      # Instalar dependencias del servidor
      cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/api
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_API_KEY
        sync: false
