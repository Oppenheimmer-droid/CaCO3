# Paperboy - Render Blueprint
# Despliegue completo con frontend React y backend Express

services:
  - type: web
    name: paperboy
    env: node
    plan: free
    region: oregon
    buildCommand: |
      # Instalar dependencias del frontend (incluyendo devDependencies)
      npm install --include=dev
      # Build del frontend React
      npm run build
      # Instalar dependencias del servidor
      cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # FAL.AI - IA para texto e imágenes (todo en uno)
      - key: AI_PROVIDER
        value: fal
      - key: IMAGE_PROVIDER
        value: fal
      - key: FAL_API_KEY
        sync: false  # ⚠️ Configura en Render Dashboard
      - key: FAL_MODEL
        value: fal-ai/flux-pro
