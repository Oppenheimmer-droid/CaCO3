# Comic Generator - Render Blueprint
# Generador de cómics con IA (frontend only)

services:
  - type: web
    name: comic-generator
    env: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NODE_ENV
        value: production
      # Groq - IA de texto (gratis)
      - key: GROQ_API_KEY
        sync: false  # ⚠️ Configura en Render Dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # FAL.AI - Generación de imágenes
      - key: IMAGE_PROVIDER
        value: fal
      - key: FAL_API_KEY
        sync: false  # ⚠️ Configura en Render Dashboard
      - key: FAL_MODEL
        value: fal-ai/flux-pro
